<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>韩国干饭人通关密码本 (终极暴食版)</title>
    <meta name="description" content="最全的韩国美食指南，支持中韩英对照、避雷吐槽、一键复制韩文点餐，助你通关韩国美食！">
    <meta name="keywords" content="韩国美食, 韩国旅游, 韩语点餐, 韩国料理, 韩国餐厅推荐">
    <meta property="og:title" content="韩国干饭人通关密码本 (终极暴食版)">
    <meta property="og:description" content="中韩英对照 · 避雷吐槽 · 一键复制 · 暴食专用">
    <meta property="og:type" content="website">


    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap"
        rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans SC"', 'sans-serif'],
                    },
                    colors: {
                        'food-bg': '#fdfcfb',
                        'food-card': '#ffffff',
                        'food-accent': '#e11d48', // Rose 600
                        'food-text': '#1c1917',
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="styles.css">
</head>

<body class="bg-food-bg text-food-text font-sans antialiased selection:bg-rose-100 selection:text-rose-900">

    <!-- Navbar -->
    <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-stone-200 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-book-open text-food-accent text-xl"></i>
                    <span class="font-black text-xl tracking-tight">韩国干饭人通关密码本 <span
                            class="text-xs bg-rose-100 text-rose-600 px-2 py-0.5 rounded-full ml-1">终极暴食版</span></span>
                </div>
                <div class="flex items-center gap-4">
                    <button onclick="toggleMyPlate()" aria-label="查看我的必吃清单"
                        class="relative p-2 text-stone-600 hover:text-food-accent transition-colors">
                        <i class="fa-solid fa-heart text-xl"></i>
                        <span id="badge-count"
                            class="absolute top-0 right-0 inline-flex items-center justify-center px-2 py-1 text-xs font-bold leading-none text-white transform translate-x-1/4 -translate-y-1/4 bg-food-accent rounded-full hidden">0</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 space-y-10">

        <!-- Header Section -->
        <section class="text-center space-y-4 max-w-3xl mx-auto">
            <h1 class="text-4xl md:text-5xl font-black text-stone-800 tracking-tight">
                🇰🇷 韩国干饭人通关密码本
            </h1>
            <p class="text-lg text-stone-500 font-medium">
                中韩英对照 · 避雷吐槽 · 一键复制 · 暴食专用
            </p>
        </section>

        <!-- Category Filters -->
        <section class="sticky top-16 z-40 bg-food-bg/95 backdrop-blur-sm py-4 border-b border-stone-100">
            <div class="flex flex-wrap justify-center gap-3" id="filter-container">
                <button onclick="filterItems('all')"
                    class="filter-btn active px-5 py-2 rounded-full text-sm font-bold transition-all bg-stone-800 text-white shadow-lg"
                    data-filter="all">全部</button>
                <button onclick="filterItems('canteen')"
                    class="filter-btn px-5 py-2 rounded-full text-sm font-bold transition-all bg-white text-stone-600 border border-stone-200 hover:border-rose-300 hover:text-rose-600"
                    data-filter="canteen">🍱 韩式餐厅</button>
                <button onclick="filterItems('cafe')"
                    class="filter-btn px-5 py-2 rounded-full text-sm font-bold transition-all bg-white text-stone-600 border border-stone-200 hover:border-rose-300 hover:text-rose-600"
                    data-filter="cafe">☕️ 咖啡甜点</button>
                <button onclick="filterItems('meat')"
                    class="filter-btn px-5 py-2 rounded-full text-sm font-bold transition-all bg-white text-stone-600 border border-stone-200 hover:border-rose-300 hover:text-rose-600"
                    data-filter="meat">🥩 肉食动物</button>
                <button onclick="filterItems('soup')"
                    class="filter-btn px-5 py-2 rounded-full text-sm font-bold transition-all bg-white text-stone-600 border border-stone-200 hover:border-rose-300 hover:text-rose-600"
                    data-filter="soup">🥘 汤汤水水</button>
                <button onclick="filterItems('noodle')"
                    class="filter-btn px-5 py-2 rounded-full text-sm font-bold transition-all bg-white text-stone-600 border border-stone-200 hover:border-rose-300 hover:text-rose-600"
                    data-filter="noodle">🍜 面食碳水</button>
                <button onclick="filterItems('street')"
                    class="filter-btn px-5 py-2 rounded-full text-sm font-bold transition-all bg-white text-stone-600 border border-stone-200 hover:border-rose-300 hover:text-rose-600"
                    data-filter="street">🍢 街头小吃</button>
        </section>

        <!-- Food Grid -->
        <section id="food-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></section>

        <!-- Empty State -->
        <div id="empty-state" class="hidden text-center py-20">
            <i class="fa-regular fa-face-surprise text-5xl text-stone-300 mb-4"></i>
            <p class="text-stone-500 text-lg">没找到这个"密码"... 换个词搜搜？</p>
        </div>
    </main>

    <!-- My Plate Drawer -->
    <div id="my-plate-drawer"
        class="fixed inset-y-0 right-0 w-full sm:w-96 bg-white shadow-2xl transform translate-x-full transition-transform duration-300 ease-in-out z-50 flex flex-col">
        <div class="p-6 bg-stone-50 border-b border-stone-200 flex justify-between items-center">
            <h2 class="text-xl font-black flex items-center gap-2 text-stone-800"><i
                    class="fa-solid fa-heart text-rose-500"></i> 我的必吃清单</h2>
            <button onclick="toggleMyPlate()" class="text-stone-400 hover:text-stone-800 transition-colors"><i
                    class="fa-solid fa-xmark text-2xl"></i></button>
        </div>
        <div class="flex-1 overflow-y-auto p-6 space-y-4" id="plate-list"></div>
        <div class="p-6 border-t border-stone-200 bg-stone-50">
            <button onclick="window.print()"
                class="w-full py-4 bg-stone-800 text-white rounded-2xl font-black hover:bg-stone-900 transition-colors shadow-lg flex justify-center items-center gap-2">
                <i class="fa-solid fa-print"></i> 打印 / 保存我的密码本
            </button>
        </div>
    </div>

    <div id="overlay" onclick="toggleMyPlate()"
        class="fixed inset-0 bg-black/20 backdrop-blur-sm z-40 hidden transition-opacity opacity-0"></div>

    <!-- Toast Notification -->
    <div id="toast"
        class="fixed bottom-5 left-1/2 transform -translate-x-1/2 bg-stone-800 text-white px-6 py-3 rounded-full shadow-2xl z-50 flex items-center gap-3 hidden">
        <i class="fa-solid fa-check-circle text-green-400"></i>
        <span id="toast-message" class="text-sm font-bold"></span>
    </div>

    <!-- Restaurant Modal -->
    <div id="restaurant-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-black/40 backdrop-blur-sm" onclick="closeRestaurantModal()"></div>
        <div
            class="restaurant-modal-content relative bg-white rounded-3xl shadow-2xl w-full max-w-lg max-h-[80vh] overflow-hidden flex flex-col">
            <div class="p-6 bg-gradient-to-r from-rose-500 to-amber-500 text-white">
                <div class="flex justify-between items-center">
                    <h3 id="restaurant-modal-title" class="text-xl font-black flex items-center gap-2">
                        <i class="fa-solid fa-store"></i> 推荐餐厅
                    </h3>
                    <button onclick="closeRestaurantModal()"
                        class="w-8 h-8 rounded-full bg-white/20 hover:bg-white/30 flex items-center justify-center transition-colors">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            </div>
            <div id="restaurant-modal-content" class="flex-1 overflow-y-auto p-6 space-y-3">
                <!-- 餐厅列表将动态插入 -->
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="data.js"></script>
    <script src="script.js"></script>
</body>

</html>
